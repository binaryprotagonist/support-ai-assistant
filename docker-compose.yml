version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: support_assistant_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: support_assistant_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:3000
      - MONGODB_URI=mongodb://mongodb:27017/support_assistant
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-1.5-flash
      - GROK_API_KEY=${GROK_API_KEY}
      - GROK_BASE_URL=https://api.x.ai/v1
      - GROK_MODEL=grok-2-latest
      - REQUEST_TIMEOUT_MS=15000
      - MAX_RETRIES=3
      - MAX_COST_PER_REQUEST_USD=0.05
      - MAX_TOKENS_PER_REQUEST=4000
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: support_assistant_client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
